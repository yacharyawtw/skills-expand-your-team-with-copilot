name: Feature Request
description: Suggest an improvement or a new feature for the Mergington High School activities website.
title: "Feature: [Brief Description]"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Request a New Feature or Improvement
        Use this form to suggest something new or an improvement to the Mergington High School activities website.
        Please be as specific as possible so the request can be worked on without further back-and-forth.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation that prompted this request. What can you not do today that you wish you could?
      placeholder: e.g., I can't tell at a glance which activities are suitable for advanced students versus beginners.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you are requesting. Include as much detail as possible — what it should look like, how it should work, etc.
      placeholder: e.g., Add a difficulty label (Beginner, Intermediate, Advanced) to each activity card so students can filter by level.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the website would this affect?
      options:
        - Activity list / cards
        - Filters (day, time, category)
        - Sign-up / registration
        - Teacher login or administration
        - Visual design or layout
        - Something else
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - High — this is blocking my work or a key need
        - Medium — it would improve things noticeably
        - Low — nice to have when time allows
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the specific things that must be true for this feature to be considered complete.
      placeholder: |
        - [ ] Users can see a difficulty label on each activity card.
        - [ ] Users can filter activities by difficulty level.
        - [ ] Activities with no difficulty set show for all levels.
    validations:
      required: true

  - type: textarea
    id: hints
    attributes:
      label: Hints and Suggested Approach
      description: Share any ideas, examples, or suggestions that might help with the implementation. This is optional but very helpful.
      placeholder: e.g., A simple dropdown in the left sidebar, similar to the existing day and time filters, would work well.

  - type: textarea
    id: limitations
    attributes:
      label: Limitations and Constraints
      description: List anything the solution must NOT do, or any technical or policy constraints to be aware of.
      placeholder: |
        e.g., 
        - Only use HTML, CSS, JavaScript, and Python — no new languages or frameworks.
        - Do not change the existing activity card layout significantly.
        - The website must remain easy to use for non-technical staff.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information, links, or screenshots that may help.
