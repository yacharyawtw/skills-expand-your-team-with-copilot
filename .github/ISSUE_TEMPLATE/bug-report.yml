name: Bug Report
description: Report something on the website that is broken, looks wrong, or is not working as expected.
title: "Bug: [Brief Description]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Report a Bug
        Use this form to report something that is not working correctly on the Mergington High School activities website.
        The more detail you provide, the easier it will be to find and fix the problem.

  - type: textarea
    id: what-happened
    attributes:
      label: What is the problem?
      description: Describe what you see that looks wrong or is not working. Be as specific as possible.
      placeholder: e.g., The "Register" button on the Soccer Team card does nothing when I click it.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What should happen instead?
      description: Describe what you expected to see or happen.
      placeholder: e.g., Clicking "Register" should open the sign-up form so I can enter a student's email address.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: List the steps someone else can follow to see the same problem.
      value: |
        1. Go to the website
        2. 
        3. 
        4. 
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the website is affected?
      options:
        - Activity list / cards
        - Filters (day, time, category)
        - Sign-up / registration form
        - Teacher login
        - Colors, layout, or visual appearance
        - Something else
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: How serious is this problem?
      options:
        - Critical — the website is unusable
        - High — a main feature is broken
        - Medium — something works incorrectly but there is a workaround
        - Low — minor visual issue or typo
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will you know this bug has been fixed?
      value: |
        - [ ] The problem described above no longer occurs.
        - [ ] The feature works as described in "What should happen instead."
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots or Additional Context
      description: Add any screenshots, links, or extra details that may help. You can paste images directly into this box.
